<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FAQ – Havans Corporation</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet"
    href="chatbot.css" />
    <style>
      /* Chat container overrides to fit your style */
      .chat-container {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        background: white;
        display: flex;
        flex-direction: column;
        height: 500px;
        max-width: 600px;
        margin: 30px auto;
      }
      #chat-messages {
        flex-grow: 1;
        overflow-y: auto;
        margin-bottom: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        background: #f4f6f8; /* match your page background */
        display: flex;
        flex-direction: column;
      }
      .message {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 8px;
        word-wrap: break-word;
      }
      .message.user {
        background: #0b3c5d; /* your dark blue */
        color: white;
        margin-left: auto;
        border-bottom-right-radius: 4px;
      }
      .message.bot {
        background: #e1e5ea;
        color: #333;
        margin-right: auto;
        border-bottom-left-radius: 4px;
      }
      #chat-form {
        display: flex;
      }
      #chat-input {
        flex-grow: 1;
        padding: 10px 16px;
        font-size: 14px;
        border-radius: 20px;
        border: 1px solid #ccc;
        outline: none;
      }
      #chat-input:focus {
        border-color: #0b3c5d;
      }
      #chat-form button {
        background: #0b3c5d;
        border: none;
        color: white;
        font-weight: 600;
        font-size: 16px;
        margin-left: 12px;
        padding: 0 18px;
        border-radius: 20px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      #chat-form button:hover {
        background: #07415a;
      }
      .faq-suggestions {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .faq-suggestions button {
        background: #1d2731; /* nav bar color */
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        color: white;
        transition: background 0.3s ease;
      }
      .faq-suggestions button:hover {
        background: #142024;
      }
    </style>
</head>
<body>
<header>
  <h1>Frequently Asked Questions</h1>
  <p>Ask Daizy or tap a question below</p>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="examinations.html">Examinations</a>
  <a href="resources.html">Resources</a>
  <a href="faq.html">FAQ</a>
  <a href="contact.html">Contact</a>
</nav>

<main class="chat-container">
  <div id="chat-messages"></div>

  <form id="chat-form">
    <input
      type="text"
      id="chat-input"
      placeholder="Ask Me Anything..."
      autocomplete="on"
      required
    />
    <button type="submit">Send</button>
  </form>

  <div class="faq-suggestions">
    <button type="button" onclick="sendFAQ('What is Havans Corporation?')">What is Havans Corporation?</button>
    <button type="button" onclick="sendFAQ('How do scenario-based exams work?')">How do scenario-based exams work?</button>
    <button type="button" onclick="sendFAQ('Is Daizy available 24/7?')">Is Daizy available 24/7?</button>
    <button type="button" onclick="sendFAQ('How can I contact support?')">How can I contact support?</button>
  </div>
</main>

<script>
  const chatMessages = document.getElementById('chat-messages');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');

  function addMessage(text, sender) {
    const msg = document.createElement('div');
    msg.classList.add('message', sender);
    msg.textContent = text;
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  const faqAnswers = {
    "What is Havans Corporation?": "Havans Corporation specializes in scenario-based learning and assessments designed to enhance real-world problem solving.",
    "How do scenario-based exams work?": "Scenario-based exams test your ability to apply knowledge to practical situations rather than memorizing facts.",
    "Is Daizy available 24/7?": "Yes, Daizy is available anytime to assist you with your questions.",
    "How can I contact support?": "You can contact support through the Contact page or by emailing support@havanscorp.com."
  };

  async function getAIResponse(message) {
  try {
    const response = await fetch("https://daizy-iu90.onrender.com/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: message })
    });

    if (!response.ok) {
      return "Sorry, the server is not responding.";
    }

    const data = await response.json();
    return data.reply || "No response received.";

  } catch (error) {
    return "Connection error. Please try again later.";
  }
}

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userMessage = chatInput.value.trim();
    if (!userMessage) return;

    addMessage(userMessage, 'user');
    chatInput.value = '';

    const botReply = await getAIResponse(userMessage);
    addMessage(botReply, 'bot');
  });

  function sendFAQ(question) {
    chatInput.value = question;
    chatForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
  }
</script>
<footer>
  <p>© 2026 Havans Corporation. All Rights Reserved.</p>
</footer>
</body>
</html>
